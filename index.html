<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque - Previsão de Demanda</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #1f2937;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #1e40af, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #718096;
            font-size: 1.1em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .stat-card {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .products-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s ease;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e53e3e, #c53030);
        }

        .btn-danger:hover {
            box-shadow: 0 10px 25px rgba(229, 62, 62, 0.3);
        }

        .product-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .product-item {
            background: #f7fafc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
            transition: all 0.3s ease;
        }

        .product-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }

        .product-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: bold;
            color: #2d3748;
        }

        .product-stock {
            font-size: 0.9em;
            color: #718096;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .chart-container h3 {
            color: #4a5568;
            margin-bottom: 20px;
            text-align: center;
        }

        .prediction-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .prediction-result {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .prediction-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .low-stock {
            color: #e53e3e;
            font-weight: bold;
        }

        .normal-stock {
            color: #38a169;
        }

        .warning-stock {
            color: #d69e2e;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .products-section {
                grid-template-columns: 1fr;
            }
            
            .charts-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏢 Sistema de Gestão de Estoque</h1>
            <p>Previsão de Demanda Inteligente com Regressão Linear</p>
        </div>

        <!-- Dashboard Cards -->
        <div class="dashboard">
            <div class="card stat-card">
                <div class="stat-number" style="color: #3b82f6;" id="totalProducts">0</div>
                <div class="stat-label">Total de Produtos</div>
            </div>
            <div class="card stat-card">
                <div class="stat-number" style="color: #e53e3e;" id="lowStockCount">0</div>
                <div class="stat-label">Estoque Baixo</div>
            </div>
            <div class="card stat-card">
                <div class="stat-number" style="color: #38a169;" id="totalValue">R$ 0</div>
                <div class="stat-label">Valor Total</div>
            </div>
        </div>

        <!-- Products Management -->
        <div class="products-section">
            <!-- Add Product Form -->
            <div class="form-section">
                <h2>📦 Adicionar Produto</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label for="productName">Nome do Produto</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="currentStock">Estoque Atual</label>
                        <input type="number" id="currentStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="minStock">Estoque Mínimo</label>
                        <input type="number" id="minStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="unitPrice">Preço Unitário (R$)</label>
                        <input type="number" id="unitPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Roupas">Roupas</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Casa">Casa e Jardim</option>
                            <option value="Livros">Livros</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Adicionar Produto</button>
                </form>
            </div>

            <!-- Products List -->
            <div class="form-section">
                <h2>📋 Lista de Produtos</h2>
                <div class="product-list" id="productsList">
                    <div class="product-item">
                        <div class="product-header">
                            <span class="product-name">Nenhum produto cadastrado</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
            <div class="chart-container">
                <h3>📊 Distribuição por Categoria</h3>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>📈 Evolução do Estoque</h3>
                <canvas id="stockChart"></canvas>
            </div>
        </div>

        <!-- Prediction Section -->
        <div class="prediction-section">
            <h2>🔮 Previsão de Demanda</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="form-group">
                    <label for="predictProduct">Produto para Previsão</label>
                    <select id="predictProduct">
                        <option value="">Selecione um produto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="predictDays">Dias para Previsão</label>
                    <input type="number" id="predictDays" min="1" max="365" value="30">
                </div>
            </div>
            <button onclick="generatePrediction()" class="btn">Gerar Previsão</button>
            <div id="predictionResult"></div>
        </div>
    </div>

    <script>
        // Global variables
        let products = [];
        let categoryChart, stockChart;

        // Sample data for demonstration
        const sampleProducts = [
            { name: "Smartphone Samsung", stock: 45, minStock: 10, price: 1299.99, category: "Eletrônicos" },
            { name: "Notebook Dell", stock: 8, minStock: 5, price: 2499.99, category: "Eletrônicos" },
            { name: "Camiseta Polo", stock: 25, minStock: 15, price: 79.99, category: "Roupas" },
            { name: "Café Premium", stock: 120, minStock: 50, price: 24.99, category: "Alimentação" }
        ];

        // Initialize the application
        function init() {
            // Load sample data
            products = [...sampleProducts];
            updateDashboard();
            renderProductsList();
            initializeCharts();
            updateProductSelect();
            
            // Add form event listener
            document.getElementById('productForm').addEventListener('submit', handleAddProduct);
        }

        // Handle adding new product
        function handleAddProduct(e) {
            e.preventDefault();
            
            const product = {
                name: document.getElementById('productName').value,
                stock: parseInt(document.getElementById('currentStock').value),
                minStock: parseInt(document.getElementById('minStock').value),
                price: parseFloat(document.getElementById('unitPrice').value),
                category: document.getElementById('category').value
            };
            
            products.push(product);
            updateDashboard();
            renderProductsList();
            updateCharts();
            updateProductSelect();
            
            // Reset form
            document.getElementById('productForm').reset();
        }

        // Update dashboard statistics
        function updateDashboard() {
            const totalProducts = products.length;
            const lowStockCount = products.filter(p => p.stock <= p.minStock).length;
            const totalValue = products.reduce((sum, p) => sum + (p.stock * p.price), 0);
            
            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('lowStockCount').textContent = lowStockCount;
            document.getElementById('totalValue').textContent = `R$ ${totalValue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        // Render products list
        function renderProductsList() {
            const container = document.getElementById('productsList');
            
            if (products.length === 0) {
                container.innerHTML = '<div class="product-item"><div class="product-header"><span class="product-name">Nenhum produto cadastrado</span></div></div>';
                return;
            }
            
            container.innerHTML = products.map((product, index) => {
                const stockStatus = product.stock <= product.minStock ? 'low-stock' : 
                                  product.stock <= product.minStock * 1.5 ? 'warning-stock' : 'normal-stock';
                
                return `
                    <div class="product-item">
                        <div class="product-header">
                            <span class="product-name">${product.name}</span>
                            <button onclick="removeProduct(${index})" class="btn btn-danger" style="padding: 5px 10px; font-size: 0.8em;">Remover</button>
                        </div>
                        <div class="product-stock ${stockStatus}">
                            Estoque: ${product.stock} | Mínimo: ${product.minStock} | Categoria: ${product.category}
                        </div>
                        <div style="color: #38a169; font-weight: bold; margin-top: 5px;">
                            R$ ${product.price.toFixed(2)} por unidade
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Remove product
        function removeProduct(index) {
            products.splice(index, 1);
            updateDashboard();
            renderProductsList();
            updateCharts();
            updateProductSelect();
        }

        // Initialize charts
        function initializeCharts() {
            // Category Chart
            const categoryCtx = document.getElementById('categoryChart').getContext('2d');
            categoryChart = new Chart(categoryCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#3b82f6', '#1d4ed8', '#06b6d4', '#0891b2',
                            '#059669', '#047857', '#dc2626', '#b91c1c'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Stock Chart
            const stockCtx = document.getElementById('stockChart').getContext('2d');
            stockChart = new Chart(stockCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Estoque Atual',
                        data: [],
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderColor: '#3b82f6',
                        borderWidth: 2
                    }, {
                        label: 'Estoque Mínimo',
                        data: [],
                        backgroundColor: 'rgba(220, 38, 38, 0.8)',
                        borderColor: '#dc2626',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            updateCharts();
        }

        // Update charts
        function updateCharts() {
            // Update category chart
            const categoryData = {};
            products.forEach(product => {
                categoryData[product.category] = (categoryData[product.category] || 0) + 1;
            });

            categoryChart.data.labels = Object.keys(categoryData);
            categoryChart.data.datasets[0].data = Object.values(categoryData);
            categoryChart.update();

            // Update stock chart
            const topProducts = products.slice(0, 10); // Show top 10 products
            stockChart.data.labels = topProducts.map(p => p.name.substring(0, 15) + '...');
            stockChart.data.datasets[0].data = topProducts.map(p => p.stock);
            stockChart.data.datasets[1].data = topProducts.map(p => p.minStock);
            stockChart.update();
        }

        // Update product select for prediction
        function updateProductSelect() {
            const select = document.getElementById('predictProduct');
            select.innerHTML = '<option value="">Selecione um produto</option>' +
                products.map((product, index) => 
                    `<option value="${index}">${product.name}</option>`
                ).join('');
        }

        // Generate prediction using linear regression
        function generatePrediction() {
            const productIndex = document.getElementById('predictProduct').value;
            const days = parseInt(document.getElementById('predictDays').value);
            
            if (!productIndex || !days) {
                alert('Por favor, selecione um produto e informe o número de dias.');
                return;
            }
            
            const product = products[productIndex];
            
            // Simulate historical data for demonstration
            const historicalDemand = generateHistoricalData(product);
            
            // Simple linear regression calculation
            const prediction = calculateLinearRegression(historicalDemand, days);
            
            // Display result
            const resultDiv = document.getElementById('predictionResult');
            resultDiv.innerHTML = `
                <div class="prediction-result">
                    <div class="prediction-value">${prediction.demand} unidades</div>
                    <div>Demanda prevista para ${days} dias</div>
                    <div style="margin-top: 10px; font-size: 0.9em;">
                        Tendência: ${prediction.trend > 0 ? '📈 Crescente' : prediction.trend < 0 ? '📉 Decrescente' : '➡️ Estável'}
                    </div>
                    <div style="margin-top: 15px; font-size: 0.9em; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px;">
                        <strong>Recomendação:</strong><br>
                        ${prediction.recommendation}
                    </div>
                </div>
            `;
        }

        // Generate simulated historical data
        function generateHistoricalData(product) {
            const data = [];
            const basedemand = Math.max(1, Math.floor(product.stock / 10));
            
            for (let i = 30; i >= 0; i--) {
                const variation = (Math.random() - 0.5) * 0.4;
                const seasonality = Math.sin(i * Math.PI / 15) * 0.2;
                const trend = -i * 0.01;
                
                const demand = Math.max(1, Math.floor(basedemand * (1 + variation + seasonality + trend)));
                data.push({ day: 30 - i, demand: demand });
            }
            
            return data;
        }

        // Calculate linear regression
        function calculateLinearRegression(data, forecastDays) {
            const n = data.length;
            const sumX = data.reduce((sum, d) => sum + d.day, 0);
            const sumY = data.reduce((sum, d) => sum + d.demand, 0);
            const sumXY = data.reduce((sum, d) => sum + (d.day * d.demand), 0);
            const sumX2 = data.reduce((sum, d) => sum + (d.day * d.day), 0);
            
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            
            const futureDemand = Math.max(1, Math.floor(slope * (30 + forecastDays) + intercept));
            
            let recommendation = "";
            if (slope > 0.5) {
                recommendation = "Demanda crescente detectada. Considere aumentar o estoque em 20-30%.";
            } else if (slope < -0.5) {
                recommendation = "Demanda decrescente. Monitore o estoque para evitar excesso.";
            } else {
                recommendation = "Demanda estável. Mantenha os níveis atuais de estoque.";
            }
            
            return {
                demand: futureDemand,
                trend: slope,
                recommendation: recommendation
            };
        }

        // Initialize the application when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
