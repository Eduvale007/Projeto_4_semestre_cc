<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque com Previsão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">GestãoPro</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="showView('inventoryView')">Estoque</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showView('forecastView')">Previsão de Demanda</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div id="inventoryView">
            <h2>Gerenciar Estoque</h2>
            <form id="productForm" class="mb-4 p-3 border rounded">
                <input type="hidden" id="productId">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="productName" class="form-label">Nome do Produto</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="col-md-2">
                        <label for="productQuantity" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="productQuantity" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    </div>
                </div>
            </form>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Produto</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    </tbody>
            </table>
        </div>

        <div id="forecastView" style="display: none;">
            <h2>Previsão de Demanda com Regressão Linear</h2>
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                         <label for="productSelect" class="form-label">Selecione o Produto</label>
                         <select id="productSelect" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label for="periodsToForecast" class="form-label">Prever demanda para o período Nº:</label>
                        <input type="number" id="periodsToForecast" class="form-control" value="7">
                    </div>
                    <button class="btn btn-success" onclick="getForecast()">Calcular Previsão</button>
                    <div id="forecastResult" class="mt-3 alert alert-info" style="display:none;"></div>
                </div>
                <div class="col-md-8">
                    <canvas id="demandChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
